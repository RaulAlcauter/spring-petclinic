services:
  mysql-petclinic:
    container_name: mysql-petclinic
    image: mysql:9.7
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env

  petclinic-app:
    container_name: petclinic-app
    image: petclinic:1.0
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      MYSQL_URL: jdbc:mysql://mysql-petclinic:3306/petclinic

volumes:
  mysql_data:
    
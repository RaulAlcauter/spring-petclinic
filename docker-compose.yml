services:
  mysql-petclinic:
    container_name: mysql-petclinic
    image: mysql:9.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    volumes:
      - mysql_data:/var/lib/mysql
  petclinic-app:
    image: petclinic:latest
    ports:
      - 8000:8080
    environment:
      - MYSQL_URL=jdbc:mysql://mysql-petclinic/petclinic
volumes:
  mysql_data:
    external: true
    

